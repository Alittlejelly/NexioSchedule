			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\n# ⚠ 两个不能省的参数/变量，少了都会在 Xcode 里构建失败：\n#  1) -Pnexio.ios=true —— 本仓库的 iOS target **默认关闭**（否则离线门禁会脏），\n#     Xcode 构建时同样必须显式开，否则找不到 iOS 目标。\n#  2) JAVA_HOME —— macOS 没有全局 JDK，Xcode 的构建环境里也没有，\n#     ./gradlew 会报 \"Unable to locate a Java Runtime\"。\n#     动态探测（/usr/libexec/java_home），别写死绝对路径 —— 换 JDK / 换机器不会再挂。\nexport JAVA_HOME=\"${JAVA_HOME:-$(/usr/libexec/java_home 2>/dev/null || echo /Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home)}\"\n\ncd \"$SRCROOT/..\"\n./gradlew -Pnexio.ios=true :ui-shared:embedAndSignAppleFrameworkForXcode\n\n# gradle 按 SDK 分目录产出（…/xcode-frameworks/$CONFIGURATION/$SDK_NAME/），\n# 而 iOS 与模拟器、乃至不同 Xcode 版本的 SDK 名字都不一样。Xcode 侧如果直接\n# 依赖那个目录，换一次 destination 就会对不上，报\n# \"Unable to resolve module dependency 'NexioShared'\"（从报错完全看不出是路径问题）。\n# 这里再加一个**固定路径软链**，Xcode 只认它 —— SDK 怎么变都不会脱节。\nmkdir -p \"$SRCROOT/Frameworks\"\nln -sfn \"$SRCROOT/../ui-shared/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/NexioShared.framework\" \"$SRCROOT/Frameworks/NexioShared.framework\"\n";
		};
